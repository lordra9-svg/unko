name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"

jobs:
  licenses:
    name: License audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - name: Audit dependency licenses
        run: cargo run --release --locked -p xtask -- license-audit

  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libdecor-0-dev libudev-dev libxss-dev libxtst-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libpulse-dev ninja-build

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Pin the build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build
        env:
          RUSTFLAGS: --remap-path-prefix=${{ github.workspace }}=/build/unko
        run: cargo build --release --locked -p unko-cli -p unko-app

      - name: Package tarball
        run: cargo run --release --locked -p xtask -- package --platform linux --arch x86_64

      - name: Build AppImage
        run: cargo run --release --locked -p xtask -- appimage dist

      - name: Checksums
        run: |
          cd dist
          sha256sum unko-linux-x86_64.tar.gz unko-*.AppImage > SHA256SUMS

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unko-linux-x86_64
          path: dist/

  windows:
    name: Windows x86_64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Pin the build epoch
        shell: bash
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked -p unko-cli -p unko-app

      - name: Package
        run: cargo run --release --locked -p xtask -- package --platform windows --arch x86_64

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unko-windows-x86_64
          path: dist/

  macos:
    name: macOS arm64
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools
        run: brew install ninja
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Pin the build epoch
        run: echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --locked -p unko-cli -p unko-app

      - name: Build the app icon
        run: cargo run --release --locked -p xtask -- icns

      - name: Package
        run: cargo run --release --locked -p xtask -- package --platform macos --arch arm64

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: unko-macos-arm64
          path: dist/

  reproducible:
    name: Reproducible build check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libx11-dev libxext-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxfixes-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libdecor-0-dev libudev-dev libxss-dev libxtst-dev \
            libgbm-dev libdrm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libpulse-dev ninja-build

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build in the checkout
        run: |
          export SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)
          export RUSTFLAGS="--remap-path-prefix=$PWD=/build/unko --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/build/cargo"
          cargo build --release --locked -p unko-cli -p unko-app
          cargo run --release --locked -p xtask -- package --platform linux --arch x86_64 --out /tmp/dist-a

      - name: Build in a second checkout
        run: |
          mkdir -p /tmp/unko-b
          tar -c --exclude=target --exclude=.git . | tar -x -C /tmp/unko-b
          cd /tmp/unko-b
          export SOURCE_DATE_EPOCH=$(git -C "$GITHUB_WORKSPACE" log -1 --format=%ct)
          export RUSTFLAGS="--remap-path-prefix=/tmp/unko-b=/build/unko --remap-path-prefix=${CARGO_HOME:-$HOME/.cargo}=/build/cargo"
          cargo build --release --locked -p unko-cli -p unko-app
          cargo run --release --locked -p xtask -- package --platform linux --arch x86_64 --out /tmp/dist-b
          cd "$GITHUB_WORKSPACE"
          cmp target/release/unko /tmp/unko-b/target/release/unko
          cmp target/release/unko-app /tmp/unko-b/target/release/unko-app
          cmp /tmp/dist-a/unko-linux-x86_64.tar.gz /tmp/dist-b/unko-linux-x86_64.tar.gz
          echo "binaries and archives are byte-identical across checkouts"

  publish:
    name: Attach release artifacts
    if: startsWith(github.ref, 'refs/tags/')
    needs: [licenses, linux, windows, macos, reproducible]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts
          merge-multiple: true
      - name: Combined checksums
        run: |
          cd artifacts
          rm -f SHA256SUMS
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' | sort -z | xargs -0 sha256sum > SHA256SUMS
      - name: Publish
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3
        with:
          files: artifacts/*
          generate_release_notes: true
