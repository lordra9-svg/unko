# cargo-deny configuration.
#
# This file encodes the repository's dependency policy and is enforced by the
# `Query cargo-deny` step of the `advisories` job in .github/workflows/ci.yml.
# It should agree with CONTRIBUTING.md and .cargo/audit.toml.

# ---------------------------------------------------------------------------
# Advisories
# ---------------------------------------------------------------------------
[advisories]
# This list must only ever shrink; a real vulnerability never goes here.
# Entries mirror .cargo/audit.toml verbatim in intent: each is a known,
# currently-unfixable "unmaintained" notice, not a live vulnerability.
ignore = [
    # bincode is unmaintained (RUSTSEC-2025-0141). Unavoidable today:
    # ggrs 0.13.0 (the newest release) depends on bincode 1.3, and our own
    # crates (unko-nes, unko-netplay, unko-snes) use the same 1.3 line. Revisit
    # when ggrs ships a release that no longer pulls bincode 1.x.
    "RUSTSEC-2025-0141",
    # instant is unmaintained (RUSTSEC-2024-0384). Unavoidable: only reachable
    # through ggrs 0.13.0's dependency tree.
    "RUSTSEC-2024-0384",
    # paste is unmaintained (RUSTSEC-2024-0436). Only reachable through
    # wgpu/metal on macOS; cannot be dropped until those crates move off it.
    "RUSTSEC-2024-0436",
    # ttf-parser is unmaintained (RUSTSEC-2026-0192). Reachable through
    # egui 0.31.1 -> ab_glyph; it clears only with an egui/eframe upgrade,
    # which is tracked separately.
    "RUSTSEC-2026-0192",
]

# ---------------------------------------------------------------------------
# Licenses
# ---------------------------------------------------------------------------
[licenses]
# The repository forbids GPL/AGPL/LGPL dependencies (see CONTRIBUTING.md).
# Do not add a GPL, AGPL, or LGPL identifier to this allow-list.
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unicode-3.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "NCSA",
    "OpenSSL",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "bzip2-1.0.6",
]
confidence-threshold = 0.9

# ---------------------------------------------------------------------------
# Bans
# ---------------------------------------------------------------------------
[bans]
multiple-versions = "warn"
# Intended to be `deny`, but 15 of 16 workspace members are publishable and
# use path-only internal dependencies, which cargo-deny classifies as
# wildcards (`allow-wildcard-paths` only exempts private crates and
# dev-dependencies). Wildcard registry deps still surface as warnings until
# the workspace marks its members `publish = false` or versions its path deps.
wildcards = "warn"
highlight = "all"

# ---------------------------------------------------------------------------
# Sources
# ---------------------------------------------------------------------------
[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
