[package]
name = "xtask"
description = "Repository automation for Unko (Rust port of the legacy scripts)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-native-roots"] }
serde_json = "1"
sha2 = "0.10"
unko-core = { path = "../crates/unko-core" }
unko-nes-api = { path = "../crates/unko-nes-api" }
unko-nes-host = { path = "../crates/unko-nes-host" }
unko-n64-host = { path = "../crates/unko-n64-host" }
unko-snes = { path = "../crates/unko-snes" }
unko-snes-host = { path = "../crates/unko-snes-host" }
tar = "0.4"
toml = "0.9"
zip = { version = "9.3", default-features = false, features = ["deflate"] }
