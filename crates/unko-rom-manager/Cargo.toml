[package]
name = "unko-rom-manager"
description = "Standalone DAT auditing, 1G1R and library rebuilding for Unko"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
quick-xml = "0.41"
zip = { version = "9.3", default-features = false, features = ["deflate"] }
crc32fast = "1"
sha1 = "0.10"
md-5 = "0.10"
sevenz-rust2 = { version = "0.24", default-features = false, features = ["bzip2", "ppmd", "compress", "util"] }
rars = { version = "0.12", default-features = false }


# DAT download is a desktop feature; mobile targets must not build a TLS stack.
[target.'cfg(not(any(target_os = "ios", target_os = "android")))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls-native-roots"] }
