[package]
name = "unko-snes"
description = "Standalone Super Nintendo / Super Famicom core (no emulator-shell dependencies)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive", "rc"] }
bincode = "1.3"
serde-big-array = "0.5"
corosensei = "0.3"

[dev-dependencies]
w65c816 = "0.1.17"
spc700 = "0.1.0"
