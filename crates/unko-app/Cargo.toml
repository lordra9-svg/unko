[package]
name = "unko-app"
description = "Desktop frontend for Unko (Dolphin-inspired UX)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "unko_app"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib", "cdylib"]

[[bin]]
name = "unko-app"
path = "src/main.rs"

[features]
default = []
# Offscreen wgpu/Vulkan renderer scaffold; not yet wired into the egui shell.
vulkan = ["dep:wgpu", "dep:pollster", "eframe/wgpu"]

[dependencies]
unko-core.workspace = true
unko-netplay = { path = "../unko-netplay" }
unko-nes-api = { path = "../unko-nes-api" }
unko-nes-host = { path = "../unko-nes-host" }
unko-snes-api = { path = "../unko-snes-api" }
unko-snes-host = { path = "../unko-snes-host" }
unko-rom-manager = { path = "../unko-rom-manager" }
unko-rom = { path = "../unko-rom" }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts"] }
egui = "0.31.1"
cpal = "0.18.2"
rtrb = "0.3.2"
hound = "3.5.1"
png = "0.18.0"
gif = "0.14.2"
directories = "6.0.0"
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = [
    # accesskit is omitted until its zbus/quick-xml 0.30 chain is upgraded
    # to quick-xml >= 0.41 (RUSTSEC-2026-0194/0195).
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
rfd = "0.17.2"
sdl3 = { version = "0.22.1", features = ["build-from-source-static"] }

[target.'cfg(target_os = "android")'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = [
    "android-native-activity",
    "default_fonts",
    "glow",
] }
winit = "0.30"

[target.'cfg(target_os = "ios")'.dependencies]
eframe = { version = "0.31.1", default-features = false, features = [
    "default_fonts",
    "wgpu",
] }
